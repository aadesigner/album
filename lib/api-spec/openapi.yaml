        totalOrders:
          type: integer
        totalProjects:
          type: integer
        ordersThisMonth:
          type: integer
        revenue:
          type: integer
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    AdminUserUpdate:
      type: object
