          type: integer

    PaginatedOrders:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    IpBlocklistEntry:
      type: object
      required: [id, ip, createdAt]
      properties:
        id:
          type: integer
        ip:
          type: string
        reason:
          type: ["string", "null"]
