        whatsappNumber:
          type: string
        basePriceLek:
          type: integer
        minPages:
          type: integer
        extraSpreadPriceLek:
          type: integer
        siteName:
          type: string
        siteTaglineAl:
          type: string
        siteTaglineEn:
          type: string
        maintenanceMode:
          type: boolean
        pendingBooksLimitEnabled:
          type: boolean
        pendingBooksLimit:
          type: integer
        rateLimitGeneralWindowMs:
          type: integer
        rateLimitGeneralMax:
          type: integer
        rateLimitAuthWindowMs:
          type: integer
        rateLimitAuthMax:
          type: integer
        rateLimitAnalyticsWindowMs:
          type: integer
        rateLimitAnalyticsMax:
          type: integer
        rateLimitUploadsWindowMs:
          type: integer
        rateLimitUploadsMax:
          type: integer
        loginLockoutThreshold:
          type: integer
        loginLockoutMinutes:
          type: integer
        maxAlbumsPerUser:
          type: integer
        maxPhotosPerAlbum:
          type: integer
        maxOrdersPerDay:
          type: integer
        maxConcurrentPdfGenerations:
          type: integer
        maxUploadFileSizeMb:
          type: integer
        allowedUploadMimeTypes:
          type: array
          items:
            type: string

    # ── Admin ─────────────────────────────────────────────────────────────

    AdminStats:
      type: object
      required: [totalUsers, totalOrders, totalProjects, ordersThisMonth, revenue, recentOrders]
      properties:
