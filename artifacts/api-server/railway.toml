# Railway → api-server
#   Dockerfile path = Dockerfile
#   Custom Start    = /app/boot-api.sh
#   (clear any old START_APP=… or pnpm start command in the dashboard)
#
# REQUIRED for production: attach a volume to THIS api-server service at /data
# (not the web service). boot-api.sh forces DATA_DIR=/data when /data exists,
# and ignores ephemeral DATA_DIR values under /app. Without the volume, every
# redeploy wipes album photos, category covers, Design Studio uploads,
# wallpapers, stickers, and print PDFs (Postgres JSON stays; image files do not).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/boot-api.sh"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
# Cost: keep 1 replica. In Railway dashboard set a Memory limit (~512–768 MB)
# so idle billing stays bounded; PDF peaks are capped in-app (max concurrent = 2).
