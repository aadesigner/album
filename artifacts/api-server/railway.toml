# Railway → api-server
#   Root Directory      = /
#   Dockerfile path     = Dockerfile
#   Config-as-code      = /artifacts/api-server/railway.toml
#   Custom Start        = sh /app/boot-api.sh

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/artifacts/api-server/**",
  "/lib/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/Dockerfile",
]

[deploy]
startCommand = "sh /app/boot-api.sh"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
