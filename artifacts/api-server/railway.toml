# Railway → api-server
#   Dockerfile path = Dockerfile
#   Custom Start    = /app/boot-api.sh
#   (clear any old START_APP=… or pnpm start command in the dashboard)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/boot-api.sh"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
