# Railway → api-server
#   Dockerfile path = Dockerfile
#   Custom Start    = /app/boot-api.sh
#   (clear any old START_APP=… or pnpm start command in the dashboard)
#
# REQUIRED for production: attach a volume to this service mounted at /data.
# boot-api.sh sets DATA_DIR=/data when that folder exists. Without it, every
# redeploy wipes album photos, category covers, Design Studio uploads,
# wallpapers, stickers, and print PDFs (Postgres settings stay, files do not).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/boot-api.sh"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
