# Railway → api-server
#   Root Directory      = /
#   Dockerfile path     = Dockerfile
#   Config-as-code      = /artifacts/api-server/railway.toml
#   Custom Start        = START_APP=api sh /app/boot.sh

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/artifacts/api-server/**",
  "/lib/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/Dockerfile",
]

[deploy]
startCommand = "START_APP=api sh /app/boot.sh"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
