# Railway → pergjithmone service Settings (MUST match):
#   Root Directory      = /
#   Builder             = Dockerfile
#   Dockerfile path     = Dockerfile.web
#   Railway Config File = /artifacts/pergjithmone/railway.toml
#
# Do NOT use Dockerfile / Dockerfile.api here — those are the API image.
#
# Variables:
#   API_URL=https://workspaceapi-server-production-3940e.up.railway.app

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"
watchPatterns = [
  "/artifacts/pergjithmone/**",
  "/lib/**",
  "/attached_assets/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/Dockerfile.web",
  "/Dockerfile",
  "/artifacts/pergjithmone/server.mjs",
  "/artifacts/pergjithmone/start.sh",
]

[deploy]
# Inline finder so even an OLD image prints its layout instead of a bare MODULE_NOT_FOUND.
startCommand = "sh -c 'echo [boot] cwd=$(pwd); ls -la /app; ls -la /app/artifacts 2>/dev/null || true; ls -la /app/artifacts/pergjithmone 2>/dev/null || true; ls -la /app/artifacts/api-server 2>/dev/null || true; for f in /app/start.sh /app/server.mjs /app/artifacts/pergjithmone/server.mjs ./server.mjs; do if [ -f \"$f\" ]; then case \"$f\" in *.sh) echo [boot] exec sh $f; exec sh \"$f\";; *) echo [boot] exec node $f; exec node \"$f\";; esac; fi; done; echo [boot] FATAL no server.mjs — wrong Dockerfile for this service; exit 1'"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
numReplicas = 1
