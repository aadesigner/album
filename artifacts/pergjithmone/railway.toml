# Railway → pergjithmone → Settings:
#   Root Directory = /
#   Config-as-code  = /artifacts/pergjithmone/railway.toml
#
# Variables (required):
#   PORT            — leave Railway default (do not force 8080 if Railway sets another)
#   BASE_PATH=/
#   API_URL=https://workspaceapi-server-production-3940e.up.railway.app
#     or private: http://${{api-server.RAILWAY_PRIVATE_DOMAIN}}:8080
#     (no trailing slash — Create Album hangs without this)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"
watchPatterns = [
  "/artifacts/pergjithmone/**",
  "/lib/**",
  "/attached_assets/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/Dockerfile.web",
  "/artifacts/pergjithmone/server.mjs",
]

[deploy]
# Works for both image layouts (slim: /app/server.mjs — full: artifacts path).
# Dashboard Start Command is overridden by this file when Config-as-code is set.
startCommand = "sh -c 'if [ -f /app/server.mjs ] && [ -d /app/dist/public ]; then exec node /app/server.mjs; else exec node /app/artifacts/pergjithmone/server.mjs; fi'"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
numReplicas = 1
