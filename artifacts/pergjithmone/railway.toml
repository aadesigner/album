# Railway → pergjithmone service Settings:
#   Root Directory      = /
#   Builder             = Dockerfile
#   Dockerfile path     = Dockerfile.web
#   Railway Config File = /artifacts/pergjithmone/railway.toml
#
# Variables:
#   API_URL=https://workspaceapi-server-production-3940e.up.railway.app
#   (no trailing slash)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"
watchPatterns = [
  "/artifacts/pergjithmone/**",
  "/lib/**",
  "/attached_assets/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/Dockerfile.web",
  "/artifacts/pergjithmone/server.mjs",
]

[deploy]
startCommand = "node /app/server.mjs"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
numReplicas = 1
