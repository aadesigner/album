# Railway → pergjithmone → Settings:
#   Root Directory = /
#   Config-as-code  = /artifacts/pergjithmone/railway.toml
#
# Variables (required):
#   PORT            — leave Railway default (do not force 8080 if Railway sets another)
#   BASE_PATH=/
#   API_URL=https://YOUR-API-SERVER.up.railway.app
#     or private: http://${{api-server.RAILWAY_PRIVATE_DOMAIN}}:8080
#     (no trailing slash — Create Album hangs without this)
#
# COST:
#   Enable Serverless (Settings → Deploy). Cap memory at ~128–256 MB.
#   This image is now static-only (no node_modules) — idle RSS should stay tiny.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"
watchPatterns = [
  "/artifacts/pergjithmone/**",
  "/lib/**",
  "/attached_assets/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/Dockerfile.web",
  "/artifacts/pergjithmone/server.mjs",
]

[deploy]
# Slim image has no pnpm workspace — must not use `pnpm --filter …`
startCommand = "node server.mjs"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
